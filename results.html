<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Results | Hairlux Agents</title>
  <meta name="description" content="Hairlux field sales and booking agents: bring in customers, track your results and get paid." />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2E2E2E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Hairlux Agents" />
  <link rel="icon" href="assets/img/pwa/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/img/pwa/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="assets/css/agent.css" rel="stylesheet" />
</head>
<body>
  <main class="page" id="main">
    <div class="page-head">
      <div><div class="eyebrow">How you are doing</div><h1 id="page-title">Results</h1></div>
      <div id="head-actions"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="filters mb-0" id="periods">
          <button class="chip" data-period="day">Day</button>
          <button class="chip active" data-period="week">Week</button>
          <button class="chip" data-period="month">Month</button>
        </div>
        <div class="row"><button class="btn btn-outline btn-sm" id="prev">&larr; Earlier</button><span class="small muted" id="range"></span><button class="btn btn-outline btn-sm" id="next">Later &rarr;</button></div>
      </div>
      <div id="content"><div class="loading"><span class="spinner"></span></div></div>
    </div>
  </main>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/results.js"></script>
</body>
</html>
